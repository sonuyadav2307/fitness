# Rebuilds the phone app on every push to main.
# The same link always downloads the newest APK, after the workflow finishes:
# https://github.com/sonuyadav2307/fitness/releases/download/android/fitness.apk

name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK="$ANDROID_SDK_ROOT"
          else
            SDK="$ANDROID_HOME"
          fi
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
          if [ -d "$SDK/platforms/android-37.0" ] && [ ! -e "$SDK/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK/platforms/android-37"
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk fitness.apk
          NOTES="Built from ${GITHUB_SHA}"
          if gh release view android >/dev/null 2>&1; then
            gh release upload android fitness.apk --clobber
            gh release edit android --notes "$NOTES" --latest --title "Android APK"
          else
            gh release create android fitness.apk \
              --title "Android APK" \
              --notes "$NOTES" \
              --latest
          fi
